# Minimal Apache configuration for crawling a media tree with mod_autoindex.
# Run: httpd -f "$PWD/apache.conf" -C "Define ROOT /tmp/cinematheque-media" -DFOREGROUND

ServerRoot "/usr"
Listen 127.0.0.1:8091
PidFile /tmp/cinematheque-apache.pid
ErrorLog /tmp/cinematheque-apache.log
LoadModule mpm_event_module libexec/apache2/mod_mpm_event.so
LoadModule unixd_module libexec/apache2/mod_unixd.so
LoadModule authz_core_module libexec/apache2/mod_authz_core.so
LoadModule mime_module libexec/apache2/mod_mime.so
LoadModule dir_module libexec/apache2/mod_dir.so
LoadModule autoindex_module libexec/apache2/mod_autoindex.so
TypesConfig /private/etc/apache2/mime.types
DocumentRoot "${ROOT}"
<Directory "${ROOT}">
    Options Indexes
    IndexOptions FancyIndexing HTMLTable NameWidth=* TrackModified
    Require all granted
</Directory>
