<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>How Cinematheque works: the catalog syncs directly among your devices, and videos play straight from where they're kept, a NAS or a folder Cinematheque shares</title>
  <style>
    .ground { fill: #ffffff; }
    .body { fill: #f5f5f7; stroke: #8e8e93; stroke-width: 2; }
    .screen { fill: #1c1c1e; }
    .slot { fill: #c7c7cc; }
    .led { fill: #30d158; }
    .name { font-size: 16px; font-weight: 600; fill: #1d1d1f; text-anchor: middle; }
    .note { font-size: 13px; fill: #6e6e73; text-anchor: middle; }
    .sync { stroke: #0a84ff; stroke-width: 3; stroke-dasharray: 7 6; fill: none; }
    .play { stroke: #ff9f0a; stroke-width: 3; fill: none; }
    .synctext { font-size: 15px; fill: #0a84ff; font-weight: 600; text-anchor: middle; }
    .playtext { font-size: 15px; fill: #c76f00; font-weight: 600; text-anchor: middle; }
    .proto { font-size: 12px; font-weight: 700; fill: #c76f00; text-anchor: middle; letter-spacing: 0.5px; }
    .cover1 { fill: #5e5ce6; } .cover2 { fill: #30b0c7; } .cover3 { fill: #ff9f0a; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0d1117; }
      .body { fill: #2c2c2e; }
      .screen { fill: #000000; }
      .slot { fill: #48484a; }
      .name { fill: #f5f5f7; }
      .note { fill: #aeaeb2; }
      .playtext, .proto { fill: #ffb340; }
    }
  </style>
  <defs>
    <marker id="sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/>
    </marker>
    <marker id="play" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/>
    </marker>
  </defs>
  <rect class="ground" width="900" height="600"/>

  <!-- The catalog syncs among the devices, both ways, directly -->
  <text class="synctext" x="450" y="28">The catalog syncs directly, device to device</text>
  <text class="note" x="450" y="48">titles, where each file is, and what you've watched; no server in the middle</text>
  <path class="sync" d="M150,106 Q450,24 740,100" marker-start="url(#sync)" marker-end="url(#sync)"/>
  <path class="sync" d="M236,108 Q310,90 380,122" marker-start="url(#sync)" marker-end="url(#sync)"/>
  <path class="sync" d="M520,122 Q610,92 704,108" marker-start="url(#sync)" marker-end="url(#sync)"/>

  <!-- Apple TV: a TV above, the box below it -->
  <rect class="body" x="60" y="118" width="180" height="112" rx="8"/>
  <rect class="screen" x="70" y="128" width="160" height="92" rx="3"/>
  <rect class="cover1" x="82" y="140" width="40" height="60" rx="3"/>
  <rect class="cover2" x="130" y="140" width="40" height="60" rx="3"/>
  <rect class="cover3" x="178" y="140" width="40" height="60" rx="3"/>
  <rect class="body" x="122" y="238" width="56" height="14" rx="4"/>
  <text class="name" x="150" y="284">Apple TV</text>

  <!-- Mac: a laptop -->
  <rect class="body" x="370" y="130" width="160" height="104" rx="8"/>
  <rect class="screen" x="380" y="140" width="140" height="84" rx="3"/>
  <rect class="cover2" x="392" y="152" width="34" height="52" rx="3"/>
  <rect class="cover3" x="434" y="152" width="34" height="52" rx="3"/>
  <rect class="cover1" x="476" y="152" width="34" height="52" rx="3"/>
  <path class="body" d="M350,234 L550,234 L542,246 L358,246 Z"/>
  <text class="name" x="450" y="284">Mac or Linux</text>

  <!-- iPhone -->
  <rect class="body" x="714" y="110" width="72" height="140" rx="14"/>
  <rect class="screen" x="720" y="118" width="60" height="124" rx="9"/>
  <rect class="cover3" x="728" y="136" width="20" height="30" rx="2"/>
  <rect class="cover1" x="752" y="136" width="20" height="30" rx="2"/>
  <rect class="cover2" x="728" y="176" width="20" height="30" rx="2"/>
  <text class="name" x="750" y="284">iPhone</text>

  <!-- The Mac serves its own folders and downloads, over HTTP too -->
  <path class="play" d="M362,180 L250,180" marker-end="url(#play)"/>
  <text class="proto" x="306" y="172">HTTP</text>
  <path class="play" d="M538,180 L706,180" marker-end="url(#play)"/>
  <text class="proto" x="622" y="172">HTTP</text>

  <!-- Videos play straight from the NAS -->
  <path class="play" d="M396,452 L176,306" marker-end="url(#play)"/>
  <path class="play" d="M450,442 L450,308" marker-end="url(#play)"/>
  <path class="play" d="M504,452 L724,306" marker-end="url(#play)"/>
  <!-- Over HTTP, from a web server, but for a computer that mounts a NAS's share (SMB) as a folder -->
  <text class="proto" x="276" y="364" transform="rotate(30 276 364)">HTTP</text>
  <text class="proto" x="470" y="376" transform="rotate(-90 470 376)">HTTP or SMB</text>
  <text class="proto" x="624" y="364" transform="rotate(-30 624 364)">HTTP</text>
      
  <!-- NAS: a box of drives -->
  <rect class="body" x="390" y="446" width="120" height="92" rx="8"/>
  <rect class="slot" x="404" y="460" width="92" height="12" rx="3"/>
  <rect class="slot" x="404" y="480" width="92" height="12" rx="3"/>
  <rect class="slot" x="404" y="500" width="92" height="12" rx="3"/>
  <circle class="led" cx="490" cy="526" r="4"/>
  <text class="name" x="450" y="562">NAS</text>
  <text class="playtext" x="450" y="588">Videos play straight from where they're kept: a NAS, or a folder Cinematheque shares</text>
</svg>
