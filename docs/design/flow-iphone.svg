<rect width="1240" height="720" fill="#ffffff"/>
<text x="20" y="30" class="cap" style="fill:#1d1d1f">iPhone: a tab bar within thumbs' reach; a stack of pages beneath each tab</text>
<text x="20" y="50" class="note" style="fill:#8e8e93">Swipe from the left edge, or the back button, retraces a tab's stack; the tab bar stays.</text>
