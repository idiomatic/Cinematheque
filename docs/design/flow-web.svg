<text x="166" y="334" class="note" style="fill:#8e8e93">its seasons, on a band below its row, as on the Mac</text>
<rect x="166" y="246" width="66" height="66" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="246" y="246" width="66" height="66" rx="3" fill="#30b0c7" opacity="0.8"/>
