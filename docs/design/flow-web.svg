<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Web: wide and narrow over the same pages (a sketch, not a mockup)</title>

<style>
  .cap { font-size: 20px; font-weight: 700; }
  .title { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; }
  .dk { fill: #1c1c1e; stroke: #3a3a3c; stroke-width: 2; }
  .lt { fill: #f5f5f7; stroke: #c7c7cc; stroke-width: 2; }
  .hd { font-size: 9px; font-weight: 600; }
  .lbl { font-size: 9px; text-anchor: middle; }
  .act { font-size: 11px; font-weight: 600; }
  .arrow { stroke: #0a84ff; stroke-width: 2; fill: none; marker-end: url(#head); }
  .pink { stroke: #ff375f; stroke-width: 2; fill: none; marker-end: url(#headp); }
  .back { stroke: #8e8e93; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#headg); }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff375f"/></marker>
  <marker id="headg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e8e93"/></marker>
</defs>

<rect width="1240" height="800" fill="#ffffff"/>
<text x="20" y="30" class="cap" style="fill:#1d1d1f">Web: wide, the Mac's sidebar; narrow, the iPhone's tab bar; the same pages behind</text>
<text x="20" y="50" class="note" style="fill:#8e8e93">Each page its own address: Back retraces them, and a title opens in a new tab or window (⌘-click, middle-click) or is bookmarked.</text>
<path d="M20,70 L50,70" class="arrow"/>
<text x="56" y="74" class="note" style="fill:#8e8e93">what you do</text>
<path d="M150,70 L180,70" class="back"/>
<text x="186" y="74" class="note" style="fill:#8e8e93">Back</text>
<path d="M230,70 L260,70" class="pink"/>
<text x="266" y="74" class="note" style="fill:#8e8e93">from outside, or into a new window or tab</text>
<text x="540" y="74" class="note" style="fill:#ff375f">pink text, dashed pink outline: proposed</text>
<rect x="20" y="110" width="580" height="320" rx="10" class="lt"/>
<text x="20" y="102" class="title" style="fill:#1d1d1f">Wide: a section (#series), a series' seasons open</text>
<rect x="20" y="110" width="130" height="320" rx="10" fill="#e8e8ed"/>
<text x="36" y="137" class="hd" style="fill:#1d1d1f">Movies</text>
<rect x="28" y="144" width="114" height="18" rx="5" fill="#d1d1d6"/>
<text x="36" y="157" class="hd" style="fill:#1d1d1f">Series</text>
<text x="36" y="177" class="hd" style="fill:#1d1d1f">Watching</text>
<text x="36" y="197" class="hd" style="fill:#1d1d1f">Watched</text>
<text x="36" y="217" class="hd" style="fill:#1d1d1f">Kept</text>
<text x="30" y="242" class="hd" style="fill:#8e8e93">Lists</text>
<text x="140" y="242" class="hd" style="fill:#8e8e93" text-anchor="end">⊕</text>
<text x="36" y="260" class="hd" style="fill:#1d1d1f">A List</text>
<text x="36" y="280" class="hd" style="fill:#1d1d1f">👥 A Shared List</text>
<text x="166" y="134" class="title" style="fill:#1d1d1f">Series</text>
<rect x="400" y="120" width="100" height="20" rx="6" fill="#fff" stroke="#c7c7cc"/>
<text x="410" y="134" class="note" style="fill:#8e8e93">⌕ Search</text>
