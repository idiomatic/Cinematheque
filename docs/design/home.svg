<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>One structure, four platforms: a sketch, not a mockup</title>
  <style>
    .frame { fill: #1c1c1e; stroke: #3a3a3c; stroke-width: 2; }
    .light { fill: #f5f5f7; stroke: #c7c7cc; stroke-width: 2; }
    .cap { font-size: 18px; font-weight: 600; fill: #1d1d1f; }
    .note { font-size: 13px; fill: #6e6e73; }
    .head { font-size: 11px; font-weight: 600; fill: #ebebf5; }
    .headd { font-size: 11px; font-weight: 600; fill: #1d1d1f; }
    .btn { fill: #3a3a3c; }
    .btnl { fill: #e5e5ea; }
    .lbl { font-size: 11px; fill: #ebebf5; text-anchor: middle; }
    .lbld { font-size: 10px; fill: #1d1d1f; text-anchor: middle; }
    .cover { fill: #5e5ce6; opacity: 0.75; }
    .cover2 { fill: #30b0c7; opacity: 0.75; }
    .cover3 { fill: #ff9f0a; opacity: 0.75; }
    .focus { fill: none; stroke: #ffffff; stroke-width: 3; }
    .side { fill: #e8e8ed; }
    .sel { fill: #d1d1d6; }
  </style>
  <rect width="1240" height="900" fill="#ffffff"/>

<g transform="translate(0,-420)">
  <!-- Mac: the sidebar is the top-level menu -->
  <text x="20" y="452" class="cap">Mac: the sidebar is the top-level menu, always shown</text>
  <rect x="20" y="464" width="580" height="340" rx="10" class="light"/>
  <rect x="20" y="464" width="140" height="340" rx="10" class="side"/>
  <circle cx="36" cy="480" r="5" fill="#ff5f57"/><circle cx="52" cy="480" r="5" fill="#febc2e"/><circle cx="68" cy="480" r="5" fill="#28c840"/>
  <g font-size="11" fill="#1d1d1f">
    <text x="36" y="510">Movies</text><text x="36" y="530">Series</text>
    <rect x="28" y="536" width="124" height="18" rx="5" class="sel"/><text x="36" y="549">Watching</text>
    <text x="36" y="570">Watched</text><text x="36" y="590">Downloaded</text>
    <text x="30" y="616" fill="#8e8e93" font-size="10">Lists</text><text x="150" y="616" fill="#8e8e93" text-anchor="end">⊕</text>
    <text x="36" y="634">A List</text><text x="36" y="654">👥 A Shared List</text>
  </g>
  <g transform="translate(176,506)">
    <rect width="56" height="80" rx="4" class="cover"/><rect x="66" width="56" height="80" rx="4" class="cover2"/>
    <rect x="132" width="56" height="80" rx="4" class="cover3"/><rect x="198" width="56" height="80" rx="4" class="cover"/>
    <rect y="100" width="56" height="80" rx="4" class="cover2"/><rect x="66" y="100" width="56" height="80" rx="4" class="cover3"/>
  </g>
  <text x="176" y="486" font-size="13" font-weight="700" fill="#1d1d1f">Watching</text>
  <rect x="452" y="464" width="148" height="340" fill="#ececf0"/>
  <rect x="340" y="472" width="104" height="20" rx="6" fill="#ffffff" stroke="#c7c7cc"/><text x="350" y="486" class="note" font-size="10">⌕ Search</text>
  <rect x="572" y="472" width="22" height="20" rx="5" fill="#e5e5ea"/><text x="583" y="486" font-size="10" text-anchor="middle" fill="#1d1d1f">▯</text>
  <rect x="468" y="504" width="116" height="140" rx="6" class="cover"/>
  <rect x="468" y="656" width="116" height="22" rx="11" fill="#0a84ff"/><text x="526" y="671" font-size="11" fill="#fff" text-anchor="middle">Resume</text>
  <text x="20" y="824" class="note">Unchanged: sections and each list in the sidebar, search above the grid, the inspector.</text>
  <text x="20" y="840" class="note">No Home: a sidebar is for clicks, a home page for scrolling. Watching (was In Progress).</text>

</g>
  <!-- Web, wide: the Mac's sidebar -->
  <text x="640" y="32" class="cap">Web, wide: the Mac's sidebar, the browser's Back</text>
  <rect x="640" y="44" width="580" height="326" rx="10" class="light"/>
  <rect x="640" y="44" width="580" height="26" rx="10" fill="#e5e5ea"/>
  <circle cx="656" cy="57" r="5" fill="#ff5f57"/><circle cx="672" cy="57" r="5" fill="#febc2e"/><circle cx="688" cy="57" r="5" fill="#28c840"/>
  <rect x="740" y="50" width="380" height="14" rx="7" fill="#ffffff"/><text x="930" y="61" class="lbld">hal9000.local:8008/#watching</text>
  <rect x="640" y="70" width="130" height="300" class="side"/>
  <g font-size="11" fill="#1d1d1f">
    <text x="656" y="120">Movies</text><text x="656" y="140">Series</text>
    <rect x="648" y="146" width="114" height="18" rx="5" class="sel"/><text x="656" y="159">Watching</text>
    <text x="656" y="180">Watched</text><text x="656" y="200">Kept</text>
    <text x="650" y="226" fill="#8e8e93" font-size="10">Lists</text><text x="760" y="226" fill="#8e8e93" text-anchor="end">⊕</text>
    <text x="656" y="244">A List</text><text x="656" y="264">👥 A Shared List</text>
  </g>
  <text x="786" y="94" font-size="14" font-weight="700" fill="#1d1d1f">Watching</text>
  <rect x="1080" y="80" width="124" height="20" rx="6" fill="#ffffff" stroke="#c7c7cc"/><text x="1090" y="94" class="note" font-size="10">⌕ Search</text>
  <g transform="translate(786,106)">
    <rect x="0" y="0" width="62" height="93" rx="4" class="cover"/>
    <rect x="72" y="0" width="62" height="93" rx="4" class="cover2"/>
    <rect x="144" y="0" width="62" height="93" rx="4" class="cover3"/>
    <rect x="216" y="0" width="62" height="93" rx="4" class="cover"/>
    <rect x="288" y="0" width="62" height="93" rx="4" class="cover2"/>
    <rect x="360" y="0" width="62" height="93" rx="4" class="cover3"/>
    <rect x="0" y="110" width="62" height="62" rx="4" class="cover2"/>
    <rect x="72" y="110" width="62" height="62" rx="4" class="cover3"/>
    <rect x="144" y="110" width="62" height="62" rx="4" class="cover"/>
  </g>
  <text x="640" y="390" class="note">As the Mac's: sections and each list in a sidebar, search at the top right; each a page</text>
  <text x="640" y="406" class="note">of its own (#movies ...), the browser's Back retracing them. Narrow, it's the iPhone's.</text>

<g transform="translate(0,420)">
  <!-- Apple TV: the home page -->
  <text x="20" y="32" class="cap">Apple TV: the home page, Back to it from anywhere</text>
  <rect x="20" y="44" width="580" height="326" rx="10" class="frame"/>
  <g transform="translate(40,62)">
    <rect width="78" height="30" rx="8" class="btn"/><text x="39" y="19" class="lbl">Movies</text>
    <rect x="88" width="78" height="30" rx="8" class="btn"/><text x="127" y="19" class="lbl">Series</text>
    <rect x="176" width="78" height="30" rx="8" class="btn"/><text x="215" y="19" class="lbl">Lists</text>
    <rect x="264" width="78" height="30" rx="8" class="btn"/><text x="303" y="19" class="lbl">Watched</text>
    <rect x="352" width="78" height="30" rx="8" class="btn"/><text x="391" y="19" class="lbl">Search</text>
    <rect x="440" width="78" height="30" rx="8" class="btn"/><text x="479" y="19" class="lbl">Settings</text>
  </g>
  <text x="40" y="118" class="head">Continue Watching</text>
  <g transform="translate(40,126)">
    <clipPath id="row1"><rect x="-4" y="-4" width="563" height="108"/></clipPath>
    <g clip-path="url(#row1)">
      <rect x="0" width="66.7" height="100" rx="5" class="cover"/>
      <rect x="0" width="66.7" height="100" rx="5" class="focus"/>
      <rect x="78.7" width="100.0" height="100" rx="5" class="cover2"/>
      <rect x="190.7" width="66.7" height="100" rx="5" class="cover3"/>
      <rect x="269.4" width="66.7" height="100" rx="5" class="cover"/>
      <rect x="348.1" width="100.0" height="100" rx="5" class="cover2"/>
      <rect x="460.1" width="66.7" height="100" rx="5" class="cover3"/>
      <rect x="538.8" width="100.0" height="100" rx="5" class="cover"/>
    </g>
  </g>
  <text x="40" y="244" class="head">A List</text><text x="560" y="244" class="head" text-anchor="end">See All 12 ›</text>
  <g transform="translate(40,252)">
    <clipPath id="row2"><rect x="-4" y="-4" width="563" height="98"/></clipPath>
    <g clip-path="url(#row2)">
      <rect x="0" width="90.0" height="90" rx="5" class="cover2"/>
      <rect x="102.0" width="60.0" height="90" rx="5" class="cover3"/>
      <rect x="174.0" width="90.0" height="90" rx="5" class="cover"/>
      <rect x="276.0" width="90.0" height="90" rx="5" class="cover2"/>
      <rect x="378.0" width="60.0" height="90" rx="5" class="cover3"/>
      <rect x="450.0" width="90.0" height="90" rx="5" class="cover"/>
      <rect x="552.0" width="60.0" height="90" rx="5" class="cover2"/>
    </g>
  </g>
  <text x="20" y="390" class="note">No tab bar: one stack of pages. Section buttons first, then what's watched most;</text>
  <text x="20" y="406" class="note">Back on the home page leaves the app. A Top Shelf title is just pushed.</text>

</g>
  <!-- iPhone: a tab bar -->
  <text x="640" y="452" class="cap">iPhone, and the web narrow: a tab bar, thumbs' reach</text>
  <rect x="820" y="464" width="200" height="400" rx="28" class="frame"/>
  <text x="836" y="506" font-size="16" font-weight="700" fill="#ebebf5">Home</text>
  <text x="836" y="530" class="head">Continue Watching</text>
  <g transform="translate(836,538)">
    <clipPath id="row3"><rect x="-4" y="-4" width="187" height="80"/></clipPath>
    <g clip-path="url(#row3)">
      <rect x="0" width="48.0" height="72" rx="4" class="cover"/>
      <rect x="56.0" width="72.0" height="72" rx="4" class="cover2"/>
      <rect x="136.0" width="48.0" height="72" rx="4" class="cover3"/>
    </g>
  </g>
  <text x="836" y="630" class="head">A List</text>
  <g transform="translate(836,638)">
    <clipPath id="row4"><rect x="-4" y="-4" width="187" height="80"/></clipPath>
    <g clip-path="url(#row4)">
      <rect x="0" width="72.0" height="72" rx="4" class="cover2"/>
      <rect x="80.0" width="48.0" height="72" rx="4" class="cover3"/>
      <rect x="136.0" width="48.0" height="72" rx="4" class="cover"/>
    </g>
  </g>
  <rect x="828" y="806" width="184" height="44" rx="22" fill="#2c2c2e"/>
  <g font-size="9" fill="#ebebf5" text-anchor="middle">
    <text x="852" y="832" fill="#0a84ff">Home</text><text x="887" y="832">Movies</text><text x="922" y="832">Series</text>
    <text x="957" y="832">Lists</text><text x="990" y="832">Search</text>
  </g>
  <text x="640" y="884" class="note">The same sections as tabs; Settings from Home's corner; the same drill-down beneath.</text>
</svg>
