<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Covers of different shapes: cells of one width in grids, one height in carousels (a sketch, not a mockup)</title>

<style>
  .cap { font-size: 20px; font-weight: 700; }
  .title { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; }
  .dk { fill: #1c1c1e; stroke: #3a3a3c; stroke-width: 2; }
  .lt { fill: #f5f5f7; stroke: #c7c7cc; stroke-width: 2; }
  .hd { font-size: 9px; font-weight: 600; }
  .lbl { font-size: 9px; text-anchor: middle; }
  .act { font-size: 11px; font-weight: 600; }
  .arrow { stroke: #0a84ff; stroke-width: 2; fill: none; marker-end: url(#head); }
  .pink { stroke: #ff375f; stroke-width: 2; fill: none; marker-end: url(#headp); }
  .back { stroke: #8e8e93; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#headg); }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/></marker>
  <marker id="headp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff375f"/></marker>
  <marker id="headg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e8e93"/></marker>
</defs>

<rect width="1240" height="520" fill="#ffffff"/>
<text x="20" y="30" class="cap" style="fill:#1d1d1f">Covers' shapes: grids give their cells one width; carousels, one height</text>
<text x="20" y="50" class="note" style="fill:#8e8e93">Covers are nearly all portrait (2:3, a poster's or a DVD box's) or square (a season's, often); a series' takes its first season's.</text>
<rect x="20" y="100" width="580" height="390" rx="10" class="lt"/>
<text x="20" y="92" class="title" style="fill:#1d1d1f">Grids (every platform's pages): every cell the column's width</text>
<text x="36" y="128" class="hd" style="fill:#1d1d1f">Movies</text>
<rect x="36" y="136" width="66" height="99" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="116" y="136" width="66" height="99" rx="3" fill="#30b0c7" opacity="0.8"/>
<rect x="196" y="136" width="66" height="99" rx="3" fill="#ff9f0a" opacity="0.8"/>
<rect x="276" y="136" width="66" height="99" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="356" y="136" width="66" height="99" rx="3" fill="#30b0c7" opacity="0.8"/>
<rect x="436" y="136" width="66" height="99" rx="3" fill="#ff9f0a" opacity="0.8"/>
<text x="36" y="254" class="hd" style="fill:#1d1d1f">Series Name</text>
<rect x="36" y="262" width="66" height="66" rx="3" fill="none" stroke="#d1d1d6" stroke-dasharray="3 3"/>
<rect x="36" y="262" width="66" height="66" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="116" y="262" width="66" height="66" rx="3" fill="none" stroke="#d1d1d6" stroke-dasharray="3 3"/>
<rect x="116" y="262" width="66" height="66" rx="3" fill="#30b0c7" opacity="0.8"/>
<rect x="196" y="262" width="66" height="66" rx="3" fill="none" stroke="#d1d1d6" stroke-dasharray="3 3"/>
<rect x="207.0" y="262" width="44" height="66" rx="3" fill="#ff9f0a" opacity="0.8"/>
<rect x="276" y="262" width="66" height="66" rx="3" fill="none" stroke="#d1d1d6" stroke-dasharray="3 3"/>
<rect x="276" y="262" width="66" height="66" rx="3" fill="#5e5ce6" opacity="0.8"/>
<text x="36" y="348" class="note" style="fill:#8e8e93">A series' seasons (the Mac's band, elsewhere its page): square cells, a 2:3 fit whole;</text>
<text x="36" y="364" class="note" style="fill:#8e8e93">movies in 2:3 cells, rows of their own, so every row's height is known before it's drawn.</text>
<text x="36" y="396" class="hd" style="fill:#1d1d1f">Series (grouped): a tile per series, its band of seasons below</text>
<rect x="36" y="404" width="66" height="66" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="116" y="404" width="66" height="66" rx="3" fill="#30b0c7" opacity="0.8"/>
<rect x="196" y="404" width="66" height="66" rx="3" fill="#ff9f0a" opacity="0.8"/>
<rect x="276" y="404" width="66" height="66" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="660" y="100" width="560" height="250" rx="10" class="dk"/>
<text x="660" y="92" class="title" style="fill:#1d1d1f">Carousels (Apple TV, iPhone, web narrow): shapes mixed, one height</text>
<text x="676" y="128" class="hd" style="fill:#ebebf5">Continue Watching</text>
<clipPath id="row1"><rect x="672" y="132" width="547" height="122"/></clipPath>
<g clip-path="url(#row1)">
<rect x="676" y="136" width="76.0" height="114" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="762.0" y="136" width="114.0" height="114" rx="3" fill="#30b0c7" opacity="0.8"/>
<rect x="886.0" y="136" width="76.0" height="114" rx="3" fill="#ff9f0a" opacity="0.8"/>
<rect x="972.0" y="136" width="76.0" height="114" rx="3" fill="#5e5ce6" opacity="0.8"/>
<rect x="1058.0" y="136" width="114.0" height="114" rx="3" fill="#30b0c7" opacity="0.8"/>
<rect x="1182.0" y="136" width="114.0" height="114" rx="3" fill="#ff9f0a" opacity="0.8"/>
</g>
<text x="676" y="266" class="hd" style="fill:#ebebf5">Movie</text>
<text x="676" y="278" class="hd" style="fill:#8e8e93">2:3</text>
<text x="762.0" y="266" class="hd" style="fill:#ebebf5">Season</text>
<text x="762.0" y="278" class="hd" style="fill:#8e8e93">1:1</text>
<text x="886.0" y="266" class="hd" style="fill:#ebebf5">Season</text>
<text x="886.0" y="278" class="hd" style="fill:#8e8e93">2:3</text>
<text x="972.0" y="266" class="hd" style="fill:#ebebf5">Movie</text>
<text x="972.0" y="278" class="hd" style="fill:#8e8e93">2:3</text>
<text x="1058.0" y="266" class="hd" style="fill:#ebebf5">Season</text>
<text x="1058.0" y="278" class="hd" style="fill:#8e8e93">1:1</text>
<text x="676" y="310" class="note" style="fill:#8e8e93">Each cover in its own shape, at one height, cut off at the edge as the row scrolls on:</text>
<text x="676" y="326" class="note" style="fill:#8e8e93">a carousel isn't a grid, so its gaps never lined up across rows anyway.</text>
</svg>
