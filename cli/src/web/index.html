<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Cinematheque</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <nav>
    <a href="#home" data-shelf="home">Home</a>
    <a href="#movies" data-shelf="movies">Movies</a>
    <a href="#series" data-shelf="series">Series</a>
    <button type="button" id="lists-tab" data-shelf="lists" popovertarget="lists-nav" aria-haspopup="menu">Lists ▾</button>
    <a href="#in-progress" data-shelf="in-progress">In Progress</a>
    <a href="#watched" data-shelf="watched">Watched</a>
    <a href="#kept" data-shelf="kept" hidden>Kept</a>
  </nav>
  <div id="lists-nav" class="menu" popover="auto" role="menu"></div>
  <select id="order" aria-label="Sort by" title="Sort by" hidden>
    <option value="title">Title</option>
    <option value="title reversed">Title, Z to A</option>
    <option value="released">Newest</option>
    <option value="released reversed">Oldest</option>
    <option value="added">Recently Added</option>
    <option value="added reversed">Earliest Added</option>
    <option value="modified">Recently Modified</option>
    <option value="modified reversed">Earliest Modified</option>
    <option value="watched">Recently Watched</option>
    <option value="watched reversed">Earliest Watched</option>
  </select>
  <!-- The Series shelf's alone: a tile per series, or every season. -->
  <label id="grouping" hidden><input type="checkbox"> Group by Series</label>
  <input id="search" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
</header>
<main id="main"></main>
<footer id="status" role="status"></footer>
<div id="player" hidden>
  <video id="video" playsinline controls></video>
  <div id="curtain"></div>
</div>
<script src="app.js"></script>
</body>
</html>
