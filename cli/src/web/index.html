<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Cinematheque</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
</head>
<body>
<!-- Wide, the Mac's sidebar; narrow, the iPhone's tab bar (#tabs), by the
     window's width (see `wide` in app.js). -->
<aside id="sidebar">
  <!-- The app's name, in the header's row, as a sidebar app's window has
       it, above the shelves. -->
  <a href="#" class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="brand-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7263d"/><stop offset="1" stop-color="#8e1023"/></linearGradient></defs><rect width="24" height="24" rx="5.5" fill="url(#brand-red)"/><path d="M6.5 9.5h11v8h-11zM8 7.5h8M9.5 5.5h5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Cinematheque</a>
  <nav aria-label="Shelves">
    <a href="#movies" data-shelf="movies">Movies</a>
    <a href="#series" data-shelf="series">Series</a>
    <a href="#watching" data-shelf="watching">Watching</a>
    <a href="#watched" data-shelf="watched">Watched</a>
  </nav>
  <div class="lists-heading"><span>Lists</span><button type="button" id="new-list" class="add" title="New list" aria-label="New list">⊕</button></div>
  <nav id="sidebar-lists" aria-label="Lists"></nav>
  <nav class="sidebar-end" aria-label="Settings"><a href="#settings" data-shelf="settings">Settings</a></nav>
</aside>
<header>
  <h1 id="shelf-title"></h1>
  <select id="order" aria-label="Sort by" title="Sort by" hidden>
    <option value="title">Title</option>
    <option value="title reversed">Title, Z to A</option>
    <option value="released">Newest</option>
    <option value="released reversed">Oldest</option>
    <option value="added">Recently Added</option>
    <option value="added reversed">Earliest Added</option>
    <option value="modified">Recently Modified</option>
    <option value="modified reversed">Earliest Modified</option>
    <option value="watched">Recently Watched</option>
    <option value="watched reversed">Earliest Watched</option>
  </select>
  <!-- The Series shelf's alone: a tile per series, or every season. -->
  <label id="grouping" hidden><input type="checkbox"> Group by Series</label>
  <input id="search" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
</header>
<main id="main"></main>
<nav id="tabs" aria-label="Shelves">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20.5h-5.5v-6h-6v6H3.5z"/></svg>Home</a>
  <a href="#movies" data-tab="movies"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7.5 4v16M16.5 4v16M3.5 9h4M3.5 15h4M16.5 9h4M16.5 15h4"/></svg>Movies</a>
  <a href="#series" data-tab="series"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M8 20.5h8"/></svg>Series</a>
  <a href="#lists" data-tab="lists"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11.5M9 12h11.5M9 17.5h11.5"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>Lists</a>
  <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Search</a>
</nav>
<!-- A title not in the library yet, put on a list by name (see askWanted). -->
<dialog id="want">
  <form method="dialog">
    <h2></h2>
    <p class="dim">It takes this place on the list as it comes, if its file is named as this is.</p>
    <div class="kinds">
      <label><input type="radio" name="kind" value="movie" checked> Movie</label>
      <label><input type="radio" name="kind" value="series"> Series</label>
    </div>
    <label>Name <input name="name" required autocomplete="off"></label>
    <label>Year <input name="year" type="number" min="1800" max="2999" placeholder="As its file will have it"></label>
    <label class="season">Season <input name="season" type="number" min="0" max="999" value="1"></label>
    <label>Note <input name="note" maxlength="1000" placeholder="Optional, as an article’s address" autocomplete="off"></label>
    <div class="buttons">
      <button type="button" onclick="this.closest('dialog').close()">Cancel</button>
      <button class="primary" type="submit">Add</button>
    </div>
  </form>
</dialog>
<footer id="status" role="status"></footer>
<div id="player" hidden>
  <video id="video" playsinline controls></video>
  <div id="curtain"></div>
</div>
<!-- Classic scripts, sharing one scope: setup and settings, the app, then
     routing, which starts it. -->
<script src="settings.js"></script>
<script src="app.js"></script>
<script src="route.js"></script>
</body>
</html>
